# ============================================================
# free5GC Portable Deployment - Built from Source
# ============================================================
# Same 5-container consolidated approach, but using binaries
# built locally via Dockerfile.build-all.
#
# Configs from config/ (default) or config-debug/ (with --debug flag).
# Logs mounted to ./logs/ for easy access.
#
# Usage:
#   ./free5gc.sh build          # Build all binaries from source
#   ./free5gc.sh start          # Start with info-level logging
#   ./free5gc.sh start --debug  # Start with debug-level logging
# ============================================================

services:

  # ── Container 1: MongoDB (Database) ────────────────────────
  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      privnet:
        aliases:
          - db

  # ── Container 2: ALL Control Plane NFs (8 NFs in 1) ───────
  free5gc-cp:
    container_name: free5gc-cp
    image: free5gc-cp-local:v4.2.0
    build:
      context: .
      dockerfile: Dockerfile.cp-local
    volumes:
      # NF configs - CONFIG_DIR defaults to config-debug/ for debug logging, use config/ for info level
      - ./${CONFIG_DIR:-config-debug}/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./${CONFIG_DIR:-config-debug}/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
      # Mount logs to host for easy access
      - ./logs/cp:/var/log/free5gc
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    ports:
      - "38412:38412/sctp"
    networks:
      privnet:
        ipv4_address: 10.100.200.16
        aliases:
          - nrf.free5gc.org
          - amf.free5gc.org
          - ausf.free5gc.org
          - udm.free5gc.org
          - udr.free5gc.org
          - smf.free5gc.org
          - nssf.free5gc.org
          - pcf.free5gc.org
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    depends_on:
      db:
        condition: service_started

  # ── Container 3: UPF (User Plane - needs kernel module) ───
  free5gc-upf:
    container_name: upf
    image: free5gc-upf-local:v4.2.0
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml 2>&1 | tee /var/log/free5gc/upf.log"
    build:
      context: .
      dockerfile: Dockerfile.upf-local
    volumes:
      - ./${CONFIG_DIR:-config-debug}/upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./logs/upf:/var/log/free5gc
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - upf.free5gc.org
    depends_on:
      free5gc-cp:
        condition: service_healthy

  # ── Container 4: WebUI (Management Console) ──────────────
  webui:
    container_name: webui
    image: free5gc/webui:v4.2.0
    command: ./webui -c ./config/webuicfg.yaml
    volumes:
      - ./config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    ports:
      - "4000:4000"
    networks:
      privnet:
        aliases:
          - webui.free5gc.org
    depends_on:
      db:
        condition: service_started
      free5gc-cp:
        condition: service_healthy

  # ── UERANSIM: gNB + UE Simulator (for testing) ────────────
  ueransim:
    container_name: ueransim
    image: free5gc-ueransim-local:latest
    build:
      context: .
      dockerfile: Dockerfile.ueransim-local
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes:
      - ./config/gnbcfg.yaml:/ueransim/config/gnbcfg.yaml
      - ./config/uecfg.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      free5gc-cp:
        condition: service_healthy

networks:
  privnet:
    name: free5gc-privnet
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-free5gc

volumes:
  dbdata:
