# ============================================================
# free5GC Minimal Deployment - 10 Mandatory Core + UERANSIM
# ============================================================
# This runs ONLY the containers required for a working 5G SA core:
#   MongoDB, NRF, AMF, AUSF, UDM, UDR, SMF, UPF, PCF, NSSF
#
# NOTE: While 3GPP considers NSSF and PCF optional, free5GC v4.2.0
# requires both:
#   - Without PCF: "AMF can not select an PCF by NRF" (registration fails)
#   - Without NSSF: "AMF can not select an NSSF by NRF" (PDU session fails)
#
# Plus UERANSIM for testing (remove for real gNB).
# No CHF, NEF, N3IWF, TNGF, WebUI.
#
# Total: 10 core containers + 1 simulator = 11
#
# Usage:
#   docker compose -f docker-compose-minimal.yaml up -d
#   docker compose -f docker-compose-minimal.yaml down
# ============================================================

version: "3.8"

services:

  # ── Database ───────────────────────────────────────────────
  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      privnet:
        aliases:
          - db

  # ── NRF: Service Registry (all NFs register here) ─────────
  free5gc-nrf:
    container_name: nrf
    image: free5gc/nrf:v4.2.0
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  # ── AMF: Front Door (N2 interface, SCTP:38412) ────────────
  free5gc-amf:
    container_name: amf
    image: free5gc/amf:v4.2.0
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        ipv4_address: 10.100.200.16
        aliases:
          - amf.free5gc.org
    depends_on:
      - free5gc-nrf

  # ── AUSF: Authentication Server (5G-AKA) ──────────────────
  free5gc-ausf:
    container_name: ausf
    image: free5gc/ausf:v4.2.0
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - free5gc-nrf

  # ── UDM: Subscriber Data Management ───────────────────────
  free5gc-udm:
    container_name: udm
    image: free5gc/udm:v4.2.0
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  # ── UDR: Subscriber Data Repository (reads MongoDB) ───────
  free5gc-udr:
    container_name: udr
    image: free5gc/udr:v4.2.0
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  # ── SMF: Session Management (N4/PFCP to UPF) ──────────────
  free5gc-smf:
    container_name: smf
    image: free5gc/smf:v4.2.0
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - free5gc-nrf
      - free5gc-upf

  # ── UPF: User Plane (N3/GTP-U, needs GTP5G kernel module) ─
  free5gc-upf:
    container_name: upf
    image: free5gc/upf:v4.2.0
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./config/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      privnet:
        aliases:
          - upf.free5gc.org

  # ── NSSF: Slice Selection (required by AMF in v4.2.0) ───────
  free5gc-nssf:
    container_name: nssf
    image: free5gc/nssf:v4.2.0
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - free5gc-nrf

  # ── PCF: Policy Control (required by AMF in v4.2.0) ────────
  free5gc-pcf:
    container_name: pcf
    image: free5gc/pcf:v4.2.0
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - free5gc-nrf

  # ── UERANSIM: gNB + UE Simulator (for testing only) ───────
  ueransim:
    container_name: ueransim
    image: free5gc/ueransim:latest
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes:
      - ./config/gnbcfg.yaml:/ueransim/config/gnbcfg.yaml
      - ./config/uecfg.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      - free5gc-amf
      - free5gc-upf

networks:
  privnet:
    ipam:
      driver: default
      config:
        - subnet: 10.100.200.0/24
    driver_opts:
      com.docker.network.bridge.name: br-free5gc

volumes:
  dbdata:
