syntax = "proto3";

package free5gc.amf;

option go_package = "github.com/free5gc/amf/internal/grpc/proto";

// HealthCheckRequest is sent by the client to query AMF health.
message HealthCheckRequest {
  string service = 1;
}

// ServingStatus represents the health state of the AMF.
enum ServingStatus {
  UNKNOWN     = 0;
  SERVING     = 1;
  NOT_SERVING = 2;
}

// HealthCheckResponse is returned by the TCP health endpoint.
// Wire bytes for SERVING: 0x08 0x01
message HealthCheckResponse {
  ServingStatus status = 1;
}

message StopRequest {
}

message StopResponse {
  string message = 1;
}

// No gRPC service definition — the TCP health endpoint uses raw TCP.
// Wire format: [varint:length][HealthCheckRequest] → [varint:length][HealthCheckResponse]
// If client sends nothing within 500ms the server responds anyway.
