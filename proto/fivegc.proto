syntax = "proto3";

package free5gc.amf;

option go_package = "github.com/free5gc/amf/internal/grpc/proto";

message StopRequest {
}

message HealthCheckRequest {
}

message HealthCheckStatus {
  enum Status {
    STARTING = 0;
    HEALTHY = 1;
    UNHEALTHY = 2;
    RECOVERING = 3;
  }
  Status health_status = 1;
  string error_msg = 2;
}

service AmfService {
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckStatus);
  rpc Stop (StopRequest) returns (HealthCheckStatus);
}
