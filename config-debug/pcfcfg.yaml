info:
  version: 1.0.2
  description: PCF initial local configuration

configuration:
  pcfName: PCF
  sbi:
    scheme: http
    registerIPv4: 10.100.200.16
    bindingIPv4: 0.0.0.0
    port: 8005
    tls:
      pem: cert/pcf.pem
      key: cert/pcf.key
  timeFormat: 2019-01-02 15:04:05
  defaultBdtRefId: BdtPolicyId-
  nrfUri: http://10.100.200.16:8000
  nrfCertPem: cert/nrf.pem
  serviceList:
    - serviceName: npcf-am-policy-control
    - serviceName: npcf-smpolicycontrol
      suppFeat: 3fff
    - serviceName: npcf-bdtpolicycontrol
    - serviceName: npcf-policyauthorization
      suppFeat: 3
    - serviceName: npcf-eventexposure
    - serviceName: npcf-ue-policy-control
  mongodb:
    name: free5gc
    url: mongodb://db:27017
  locality: area1
  metrics:
    enable: false
    scheme: http
    bindingIPv4: 0.0.0.0
    port: 9091
    tls:
      pem: cert/pcf.pem
      key: cert/pcf.key
    namespace: free5gc

logger:
  enable: true
  level: debug
  reportCaller: false
