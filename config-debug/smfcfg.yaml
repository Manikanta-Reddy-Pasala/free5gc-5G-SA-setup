info:
  version: 1.0.7
  description: SMF initial local configuration

configuration:
  smfName: SMF
  sbi:
    scheme: http
    registerIPv4: 10.100.200.16
    bindingIPv4: 0.0.0.0
    port: 8007
    tls:
      key: cert/smf.key
      pem: cert/smf.pem
  serviceNameList:
    - nsmf-pdusession
    - nsmf-event-exposure
    - nsmf-oam
  snssaiInfos:
    - sNssai:
        sst: 3
        sd: 198153
      dnnInfos:
        - dnn: internet
          dns:
            ipv4: 8.8.8.8
            ipv6: 2001:4860:4860::8888
  plmnList:
    - mcc: 001
      mnc: 01
  locality: area1
  pfcp:
    nodeID: smf.free5gc.org
    listenAddr: smf.free5gc.org
    externalAddr: smf.free5gc.org
  userplaneInformation:
    upNodes:
      gNB1:
        type: AN
      UPF:
        type: UPF
        nodeID: upf.free5gc.org
        addr: upf.free5gc.org
        sNssaiUpfInfos:
          - sNssai:
              sst: 3
              sd: 198153
            dnnUpfInfoList:
              - dnn: internet
                pools:
                  - cidr: 10.60.0.0/16
                staticPools:
                  - cidr: 10.60.100.0/24
        interfaces:
          - interfaceType: N3
            endpoints:
              - upf.free5gc.org
            networkInstances:
              - internet
    links:
      - A: gNB1
        B: UPF
  t3591:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  t3592:
    enable: true
    expireTime: 16s
    maxRetryTimes: 3
  nrfUri: http://10.100.200.16:8000
  nrfCertPem: cert/nrf.pem
  urrPeriod: 10
  urrThreshold: 1000
  requestedUnit: 1000
  metrics:
    enable: false
    scheme: http
    bindingIPv4: 0.0.0.0
    port: 9091
    tls:
      pem: cert/smf.pem
      key: cert/smf.key
    namespace: free5gc

logger:
  enable: true
  level: debug
  reportCaller: false
