version: 1.0.3
description: UPF initial local configuration

pfcp:
  addr: upf.free5gc.org
  nodeID: upf.free5gc.org
  retransTimeout: 1s
  maxRetrans: 3

gtpu:
  forwarder: gtp5g
  ifList:
    - addr: upf.free5gc.org
      type: N3

dnnList:
  - dnn: internet
    cidr: 10.206.0.0/16

logger:
  enable: true
  level: debug
  reportCaller: false
